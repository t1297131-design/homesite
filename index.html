<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030305" />
    <meta name="description" content="goodname" />
    <title>goodname</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="universe" aria-label="goodname homepage">
      <canvas class="starfield" aria-hidden="true"></canvas>
      <div class="nebula" aria-hidden="true"></div>
      <div class="center-glow" aria-hidden="true"></div>

      <h1 class="wordmark" aria-label="goodname" tabindex="0"><span>good</span><span>name</span></h1>

      <button class="motion-button" type="button" aria-pressed="true">
        <span class="motion-indicator" aria-hidden="true"><i></i></span>
        <span class="motion-label">motion on</span>
      </button>

      <div class="hint hint-left"><span class="hint-dot"></span><span>move to bend the stars</span></div>
      <div class="hint hint-right"><span>click to send a ripple</span><span class="click-icon" aria-hidden="true">↗</span></div>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
